name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pydantic pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short --cov=tee --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

  # This job computes the code hash that gets embedded at build time.
  # The hash must match what the verification tool computes inside the TEE.
  compute-code-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute application code hash
        run: |
          # Deterministic hash of all source files (same algorithm as verify_code_hash)
          find . -type f \
            ! -path '*/__pycache__/*' \
            ! -name '*.pyc' \
            ! -path '*/.git/*' \
            ! -path '*/node_modules/*' \
            | sort \
            | while read f; do
                echo -n "$f" | sha256sum | cut -d' ' -f1
                sha256sum "$f" | cut -d' ' -f1
              done \
            | sha256sum | cut -d' ' -f1 > CODE_HASH.txt

          echo "Code hash: $(cat CODE_HASH.txt)"
          echo "Git commit: ${{ github.sha }}"

      - name: Upload code hash
        uses: actions/upload-artifact@v4
        with:
          name: code-hash
          path: CODE_HASH.txt

  # Docker build + push to GHCR — CPU CVM image (python:3.12-slim, no CUDA)
  # Only runs on push to main (not on PRs)
  docker-push:
    runs-on: ubuntu-latest
    needs: [test, lint, compute-code-hash]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download code hash
        uses: actions/download-artifact@v4
        with:
          name: code-hash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read code hash
        id: code-hash
        run: echo "hash=$(cat CODE_HASH.txt)" >> "$GITHUB_OUTPUT"

      - name: Build and push CPU CVM container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tee/Dockerfile
          push: true
          tags: |
            ghcr.io/interiority-inc/kin-tee-handler:latest
            ghcr.io/interiority-inc/kin-tee-handler:${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            CODE_HASH=${{ steps.code-hash.outputs.hash }}
