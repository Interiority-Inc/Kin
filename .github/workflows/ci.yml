name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pydantic pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        run: |
          cd kin
          python -m pytest tests/unit/ -v --tb=short --cov=tee --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check kin/

  # This job computes the code hash that gets embedded at build time.
  # The hash must match what the verification tool computes inside the TEE.
  compute-code-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute application code hash
        run: |
          # Deterministic hash of all source files (same algorithm as verify_code_hash)
          find kin/ -type f \
            ! -path '*/__pycache__/*' \
            ! -name '*.pyc' \
            ! -path '*/.git/*' \
            ! -path '*/node_modules/*' \
            | sort \
            | while read f; do
                echo -n "$f" | sha256sum | cut -d' ' -f1
                sha256sum "$f" | cut -d' ' -f1
              done \
            | sha256sum | cut -d' ' -f1 > CODE_HASH.txt

          echo "Code hash: $(cat CODE_HASH.txt)"
          echo "Git commit: ${{ github.sha }}"

      - name: Upload code hash
        uses: actions/upload-artifact@v4
        with:
          name: code-hash
          path: CODE_HASH.txt

  # Docker build (does not push — that's a manual deployment step)
  docker-build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TEE container
        run: |
          docker build \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -f kin/tee/Dockerfile \
            -t kin-tee:${{ github.sha }} \
            kin/
