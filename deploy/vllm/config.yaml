# vLLM Serving Configuration for Kin
#
# Serves Qwen 3.8-27B inside the TEE for confidential inference.
# The model runs on a single NVIDIA H100 (80-94GB VRAM).
#
# Key settings:
# - Listens on localhost ONLY (127.0.0.1) — never exposed outside the TEE
# - Reasoning parser enabled for thinking mode
# - Tool calling enabled for verification tools
# - GPU memory utilization set to 90% (leaves room for KV cache)

model: "Qwen/Qwen3.8-27B"

# Network — localhost only, never exposed outside the TEE
host: "127.0.0.1"
port: 8000

# Context window — 131K tokens for MVP (half of 262K max)
# Leaves ample room for spirit.md + conversation history
# Can increase to 262144 if spirit.md grows very large
max_model_len: 131072

# Quantization — FP8 for quality (28GB VRAM)
# If cost becomes prohibitive, test Q4_K_M but verify
# that reflection quality doesn't degrade
dtype: "auto"

# GPU memory
gpu_memory_utilization: 0.90

# Reasoning / thinking mode
reasoning_parser: "qwen3"

# Tool calling (for verification tools)
enable_auto_tool_choice: true
tool_call_parser: "qwen3_xml"

# Trust remote code (required for Qwen)
trust_remote_code: true

# Tokenizer
tokenizer_mode: "auto"

# Logging — inside TEE, never exposed
# NEVER log prompt contents (they include spirit.md)
disable_log_prompts: true
disable_log_stats: false

# Speculative decoding (optional, improves latency)
# Uncomment if using an MTP-capable quantization
# speculative_config:
#   method: "mtp"
#   num_speculative_tokens: 3
