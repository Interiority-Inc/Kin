version: "3"
services:
  handler:
    image: ghcr.io/interiority-inc/kin-tee-handler:5bfdebc6841c70209543652712fb83770c157ba0
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - spirit-data:/data
    environment:
      - PHALA_INFERENCE_API_KEY=${PHALA_INFERENCE_API_KEY}
      - INFERENCE_ENDPOINT=${INFERENCE_ENDPOINT:-https://inference.phala.com/v1}
      - MODEL_ID=${MODEL_ID:-qwen/qwen3-32b}
      - KIN_SPIRIT_DIR=/data/spirits
      # Code hash override: correct value computed with the real algorithm
      # (see tee/verification/code_hash.py). Overrides the Dockerfile ENV
      # until the GHA compute-code-hash fix is pushed (needs workflow scope).
      - KIN_CODE_HASH=${KIN_CODE_HASH:-}
      - KIN_EXPECTED_CPU_MEASUREMENT=${KIN_EXPECTED_CPU_MEASUREMENT:-}
      # Private system prompt template (secret, injected at deploy time).
      # See tee/prompts/README.md. Never commit its value.
      - KIN_SYSTEM_PROMPT=${KIN_SYSTEM_PROMPT:-}
    ports:
      - "8080:8080"
    restart: always
volumes:
  spirit-data:
