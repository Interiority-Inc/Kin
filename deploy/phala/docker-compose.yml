version: "3"
services:
  handler:
    image: ghcr.io/interiority-inc/kin-tee-handler:latest
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p $${KIN_SPIRIT_DIR:-/data/spirits}
        sed -i 's/urandom(16)/urandom(32)/;s/token_hex(16)/token_hex(32)/' /app/tee/handler/main.py /app/tee/verification/attestation.py
        sed -i 's/upstream.get("verified", False)/any(e.get("type")=="upstream.verified" and e.get("result")=="verified" for e in receipt.get("event_log",[]))/' /app/tee/inference/receipts.py
        sed -i 's/bool(receipt.get("request_hash"))/any(e.get("type")=="request.received" and e.get("body_hash") for e in receipt.get("event_log",[]))/;s/bool(receipt.get("response_hash"))/any(e.get("type")=="response.returned" and e.get("body_hash") for e in receipt.get("event_log",[]))/' /app/tee/inference/receipts.py
        cd /app
        exec python3 -m uvicorn tee.handler.main:app --host 0.0.0.0 --port 8080 --workers 1 --log-level info 2>&1
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - spirit-data:/data
    environment:
      - PHALA_INFERENCE_API_KEY=${PHALA_INFERENCE_API_KEY}
      - INFERENCE_ENDPOINT=${INFERENCE_ENDPOINT:-https://inference.phala.com/v1}
      - MODEL_ID=${MODEL_ID:-qwen/qwen3-32b}
      - KIN_SPIRIT_DIR=/data/spirits
      - KIN_EXPECTED_CPU_MEASUREMENT=${KIN_EXPECTED_CPU_MEASUREMENT:-}
      - KIN_CODE_HASH=${KIN_CODE_HASH:-}
      - KIN_GIT_COMMIT=${KIN_GIT_COMMIT:-}
    ports:
      - "8080:8080"
    restart: always
volumes:
  spirit-data:
